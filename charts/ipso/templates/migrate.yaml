{{- include "ipso.checks" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ipso.fullname" . }}-migrate
  labels:
    {{- include "ipso.labels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "ipso.selector" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ipso.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "ipso.ref" (dict "repository" .Values.postgresql.image.repository "digest" .Values.postgresql.image.digest "label" "postgresql.image.digest") }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "ipso.fullname" . }}-postgresql -p 5432 -U postgres -d ipso; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "ipso.ref" (dict "repository" .Values.image.repository "digest" .Values.image.digest "label" "image.digest") }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/ipso-server", "migrate"]
          env:
            - name: IPSO_MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: migrate-database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
