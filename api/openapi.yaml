  /v1/verdicts:
    get:
      operationId: list_verdicts
      tags: [verification]
      summary: List the stored verdicts, newest first, for a repository or a decision or all.
      description: >-
        Each item is one decision check of one uploaded run, with the run it came from. The run, the commit,
        the workflow and the repository are the ones the signed CI token named when it was uploaded, and
        `run_url` is built from them. `known` is the transaction time: only the uploads stored by then are
        listed, and absent means now. A verdict whose report carried the digests of its violations is read
        against the recorded baseline of its decision and repository as known at that time, and `baseline`
        says the result (ADR-0122). A verdict that is a fail or a waived is read against the waivers recorded
        for its decision, as known at that time, and `waiver` says the result (ADR-0123). `result` stays what
        the run reported.
      parameters:
        - $ref: '#/components/parameters/VerdictRepo'
        - $ref: '#/components/parameters/VerdictDecision'
        - $ref: '#/components/parameters/Known'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: One page of verdicts, newest first. Pass the last `id` as `before` for the next page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [known, verdicts]
                properties:
                  known:
                    type: string
                    format: date-time
                    description: The transaction time the page was read at.
                  verdicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoredVerdict'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: upload_verdicts
      tags: [verification]
      summary: Store the verdicts of one CI run.
      description: >-
        Accepted only with a GitHub Actions OIDC token for this server's CI audience, in the Authorization
        header. The tenant is the one that owns the GitHub App installation of the repository the token names,
        found through GitHub and the installation mapping (ADR-0101), and the body has no field that names a
        tenant, a repository, a commit or a run. The route exists only when the server is configured for
        uploads, and it takes no query. The body holds the verdict report an `ipso check` command wrote with
        `--report`, and the SHA-256 of the SARIF file it wrote with `--sarif`. Plan values, resource addresses,
        violation messages and SARIF never leave the runner (ADR-0006). The same run, attempt and content is
        stored once: a repeat is 200 with the first upload's id, and a new upload is 201.
      security:
        - ciToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerdictUpload'
      responses:
        '200':
          description: The same run had already uploaded the same content, and nothing was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAnswer'
        '201':
          description: The verdicts were stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAnswer'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          description: No bearer token, or one that is not a valid GitHub Actions token for the CI audience.
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No installation of this server's tenant covers the repository the token names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/exports:
    post:
      operationId: start_export
      tags: [export]
      summary: Ask for an export of the tenant, encrypted to an age public key.
      description: >-
        Only an admin who is a person takes it (ADR-0108, ADR-0111), so an agent receives 403. The export is the
        archive `ipso-server tenant export` writes, and `ipso-server tenant restore` reads it (ADR-0100). The
        worker makes it, so the answer is 202 and the export is `pending` until it is `ready`: read it with
        `get_export`. It is encrypted to the one native or hybrid age public key in `recipient`, which the
        route refuses with 400 when it cannot read it, and the server never keeps the archive in the clear.
        A tenant holds one current export. While one is pending or running this is 409. A tenant may ask again
        ten minutes after its last export finished or failed, and sooner is 429 with `Retry-After`. A new request
        replaces a finished export: the old one is no longer served, and its parts are kept for half an hour so
        that a download in flight can end. An export is kept for 24 hours and then deleted. The request is
        logged with the person's id in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: The request was recorded. The export is pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/exports/current:
    get:
      operationId: current_export
      tags: [export]
      summary: Read the export the tenant holds.
      description: >-
        Only an admin who is a person takes it (ADR-0108, ADR-0111, ADR-0115). It answers the newest export of
        the tenant that is not replaced and has not expired, in any state, so the web app finds the export
        again after a reload or from another browser, and a 409 from `start_export` can be followed by a read.
        It is 404 when the tenant holds none. A viewer, any other role and every agent receive the plain 403.
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/exports/{id}:
    get:
      operationId: get_export
      tags: [export]
      summary: Read the state of an export.
      description: >-
        Only an admin who is a person takes it (ADR-0108, ADR-0111). `bytes` and `sha256` describe the
        ciphertext and are set once the export is `ready`. An id the tenant does not have, one that has
        expired, and one that belongs to another tenant are the same 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/exports/{id}/archive:
    get:
      operationId: download_export
      tags: [export]
      summary: Download the archive of a ready export.
      description: >-
        Only an admin who is a person takes it (ADR-0108, ADR-0111). The body is the age file, which the
        holder of the private key of `recipient` opens with stock `age`, `gunzip` and `jq`, and it is as long
        as `bytes` says. This is the one route that is not held to the response cap or the request deadline:
        it streams, a client that stalls for two minutes is dropped, one download lasts at most 30 minutes, and
        a process sends at most two at once, so another one is 429 with `Retry-After`. If the server cannot
        finish the stream it closes the connection short of the declared length, and age authenticates the
        file, so a cut archive is never taken for a whole one. A download that begins is logged with the
        person's id before the first byte. An export that is not ready is 409, and one that is unknown or
        expired is 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The archive.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: An attachment named ipso-export-{id}.age.
            Content-Length:
              schema:
                type: integer
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          description: The method is not GET.
          headers:
            Allow:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A signed JWT from the configured issuer for this API's audience. It is read from the Authorization
        header only. Which tenant and principal it speaks for is set by the login that the issuer and the
        subject of the token are bound to (ADR-0093).
    ciToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The OIDC token of a GitHub Actions job (issuer https://token.actions.githubusercontent.com), requested
        for the audience this server's operator set for uploads. The repository, run, commit and workflow it
        names are GitHub's word and are what the upload is recorded under. It is accepted only by
        POST /v1/verdicts, and a token for the API is not accepted there.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ipso-session
      description: >-
        The cookie of a browser session, set by GET /auth/callback/{provider} after a person signs in
        through an identity provider (ADR-0099). Those routes are outside this document. The cookie is
        honoured only when sign-in is configured and no Authorization header is sent. A request that could
        change state and comes from another site is 403, and a cookie that is repeated, malformed, unknown,
        or expired is 401.
  parameters:
    Valid:
      name: valid
      in: query
      required: false
      description: The valid time. Absent means now, and the answer echoes the time used.
      schema:
        type: string
        format: date-time
    Known:
      name: known
      in: query
      required: false
      description: The transaction time. Absent means now, and the answer echoes the time used.
      schema:
        type: string
        format: date-time
    RequiredValid:
      name: valid
      in: query
      required: true
      schema:
        type: string
        format: date-time
    RequiredKnown:
      name: known
      in: query
      required: true
      schema:
        type: string
        format: date-time
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Before:
      name: before
      in: query
      required: false
      description: The last id of the previous page.
      schema:
        type: string
        format: uuid
    VerdictRepo:
      name: repo
      in: query
      required: false
      description: An owner/name, compared in lowercase. Absent matches every repository.
      schema:
        type: string
        minLength: 1
        maxLength: 140
    VerdictDecision:
      name: decision
      in: query
      required: false
      description: An EDR id or a slug. Absent matches every decision.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Repo:
      name: repo
      in: query
      required: true
      description: A lowercase owner/name.
      schema:
        type: string
        minLength: 1
    Path:
      name: path
      in: query
      required: false
      description: A path relative to the repository root. Absent matches every path scope, which widens the answer.
      schema:
        type: string
        maxLength: 4096
    Env:
      name: env
      in: query
      required: false
      description: An environment. Absent matches every env scope, which widens the answer.
      schema:
        type: string
  responses:
    InvalidQuery:
      description: The query, the path, or the body is not usable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No bearer token or session cookie, or one that is not valid. A session cookie that is repeated, malformed, unknown, or expired is cleared in the answer.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The token speaks for no principal of a tenant here, no role of the principal allows this operation, or a request that could change state came from another origin with a session cookie. The answer says nothing more about the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: The request body is over the cap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: The request body is not application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: This tenant has no calls left for now.
      headers:
        Retry-After:
          description: Seconds until a call would be allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: The answer could not be read, or it was over the response cap and was refused whole.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Timeout:
      description: The request ran past its deadline.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: An id the request names is not one of this tenant's, or a premise has no open review reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The registry refuses the change because of what it already holds, such as a repeat, a scope that still has a child or a role binding, a supersession the decisions do not span, or a waiver outside its decision. The answer does not say which.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: The request ran past its deadline, or GitHub or the store could not say which installation covers the repository.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: A lowercase hex SHA-256.
    VerdictCheck:
      type: string
      enum: [plan, ci, checkov, pulumi, cloudformation, arm, depcruise, semgrep, archunit, importlinter, kyverno, gatekeeper, eslint]
      description: The ipso check command that wrote the report.
    CheckVerdict:
      type: object
      additionalProperties: false
      required: [decision_id, slug, check_index, mode, result, violations]
      properties:
        decision_id:
          type: string
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          description: The EDR id of the decision.
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 128
        check_index:
          type: integer
          minimum: 0
          maximum: 1048575
        mode:
          type: string
          enum: [block, warn, advise]
        result:
          type: string
          enum: [pass, fail, waived, error]
        violations:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The number of denials. 0 for pass and error, at least 1 for fail and waived.
        fingerprints:
          type: array
          maxItems: 100000
          items:
            $ref: '#/components/schemas/Sha256'
          description: >-
            The digests of the violations of the check, sorted and distinct (ADR-0059). Version 2 reports have
            the key on every verdict and version 1 reports on none, and the server enforces both. A pass and an
            error have none. A waived verdict has none or one for each violation. A failed verdict has none or
            every digest of the check, covered by the baseline of the runner or not, so at least as many as its
            violations. It is empty when the runner sent none: no baseline, a waiver, an error, or a violation
            that has no identity.
    VerdictReport:
      type: object
      additionalProperties: false
      required: [report_version, ipso_version, evaluated_at, env, build_sha256, verdicts]
      description: >-
        The report of ADR-0030, version 1 or 2, exactly as the command wrote it. Version 2 adds the digests of
        the violations to each verdict (ADR-0122). Beyond the six keys every report
        has, each check has its own keys, and the server refuses a report with any other set. plan has
        plan_sha256. ci has commit_sha and evidence_sha256. checkov has evidence_sha256. pulumi,
        cloudformation and arm have adapter, equal to the check, and input_sha256. depcruise, semgrep,
        archunit, importlinter, kyverno, gatekeeper and eslint have paths and their engine's version key
        (depcruise_version, semgrep_version, archunit_version, importlinter_version, kyverno_version,
        gator_version, eslint_version), which is empty when the engine did not run.
      properties:
        report_version:
          type: integer
          enum: [1, 2]
        ipso_version:
          type: string
          minLength: 1
          maxLength: 64
        evaluated_at:
          type: string
          format: date-time
        env:
          type: string
          maxLength: 256
        build_sha256:
          $ref: '#/components/schemas/Sha256'
        verdicts:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/CheckVerdict'
        plan_sha256:
          $ref: '#/components/schemas/Sha256'
        evidence_sha256:
          $ref: '#/components/schemas/Sha256'
        input_sha256:
          $ref: '#/components/schemas/Sha256'
        commit_sha:
          type: string
          pattern: '^[0-9a-f]{40}$|^[0-9a-f]{64}$'
        adapter:
          type: string
          enum: [pulumi, cloudformation, arm]
        paths:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 512
        depcruise_version:
          type: string
          maxLength: 64
        semgrep_version:
          type: string
          maxLength: 64
        archunit_version:
          type: string
          maxLength: 64
        importlinter_version:
          type: string
          maxLength: 64
        kyverno_version:
          type: string
          maxLength: 64
        gator_version:
          type: string
          maxLength: 64
        eslint_version:
          type: string
          maxLength: 64
    VerdictUpload:
      type: object
      additionalProperties: false
      required: [check, report]
      properties:
        check:
          $ref: '#/components/schemas/VerdictCheck'
        report:
          $ref: '#/components/schemas/VerdictReport'
        sarif_sha256:
          $ref: '#/components/schemas/Sha256'
    UploadAnswer:
      type: object
      additionalProperties: false
      required: [id, verdicts]
      properties:
        id:
          type: string
          format: uuid
          description: The stored upload. For a repeat, the first one.
        verdicts:
          type: integer
          minimum: 0
    StoredVerdict:
      type: object
      additionalProperties: false
      required:
        - id
        - upload_id
        - decision_id
        - slug
        - check_index
        - mode
        - result
        - violations
        - repo
        - sha
        - ref
        - event
        - workflow_ref
        - run_id
        - run_attempt
        - run_url
        - check
        - env
        - ipso_version
        - evaluated_at
        - recorded_at
        - build_sha256
        - sarif_sha256
        - evidence
        - baseline
        - waiver
      properties:
        id:
          type: string
          format: uuid
        upload_id:
          type: string
          format: uuid
        decision_id:
          type: string
        slug:
          type: string
        check_index:
          type: integer
        mode:
          type: string
          enum: [block, warn, advise]
        result:
          type: string
          enum: [pass, fail, waived, error]
        violations:
          type: integer
        repo:
          type: string
          description: The lowercase owner/name the signed token named.
        sha:
          type: string
        ref:
          type: string
        event:
          type: string
          description: The GitHub event that started the workflow.
        workflow_ref:
          type: string
        run_id:
          type: integer
          format: int64
        run_attempt:
          type: integer
        run_url:
          type: string
          format: uri
        check:
          $ref: '#/components/schemas/VerdictCheck'
        env:
          type: string
        ipso_version:
          type: string
        evaluated_at:
          type: string
          format: date-time
          description: The time the runner says it evaluated the checks.
        recorded_at:
          type: string
          format: date-time
          description: The time the server stored the upload.
        build_sha256:
          $ref: '#/components/schemas/Sha256'
        sarif_sha256:
          oneOf:
            - $ref: '#/components/schemas/Sha256'
            - type: 'null'
          description: The digest of the SARIF file the same command wrote, or null.
        evidence:
          type: object
          description: The hashes, paths and engine version only that check's report has.
        baseline:
          oneOf:
            - $ref: '#/components/schemas/VerdictBaseline'
            - type: 'null'
          description: >-
            The verdict read against the recorded baseline, or null when the run sent no digest for it. The
            `result` above stays what the run reported.
        waiver:
          oneOf:
            - $ref: '#/components/schemas/VerdictWaiver'
            - type: 'null'
          description: >-
            The verdict read against the waivers recorded for its decision, or null when the run reported pass
            or error. The `result` above stays what the run reported, and so does `baseline`.
    VerdictWaiver:
      type: object
      additionalProperties: false
      required: [result, expires_at]
      description: >-
        The reading of a verdict that is a fail or a waived against the waivers recorded for its decision, as
        known at the time of the read (ADR-0123). The valid time is the time the server stored the upload. A
        waiver covers it when its scope covers every path of the repository, so a waiver of a path never does,
        and a waiver of an environment does only when the upload names that environment. The reason, the
        approver, the ticket and the id of a waiver are not in it.
      properties:
        result:
          type: string
          enum: [waived, fail]
          description: >-
            waived when a waiver recorded by the time of the read covers the repository and the environment at
            the time the upload was stored, and fail otherwise, which includes no decision or more than one for
            the EDR id, and a waiver that was recorded after the time of the read.
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
          description: The latest end among the waivers that cover it, or null for fail.
    VerdictBaseline:
      type: object
      additionalProperties: false
      required: [result, fingerprints, waived]
      description: >-
        The reading of a verdict against the baseline recorded for its decision and repository, as known at the
        time of the read (ADR-0122). The valid time is the time the server stored the upload.
      properties:
        result:
          type: string
          enum: ['waived(baseline)', fail]
          description: >-
            waived(baseline) when the baseline holds every digest the run sent, and fail otherwise, which
            includes no recorded baseline, no decision or more than one for the EDR id, and a grandfather
            period that does not cover the time the upload was stored.
        fingerprints:
          type: integer
          minimum: 1
          description: The number of digests the run sent.
        waived:
          type: integer
          minimum: 0
          description: The number of those digests the baseline holds.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid query
            - unauthorized
            - forbidden
            - not found
            - conflict
            - too large
            - unsupported media type
            - rate limited
            - timeout
            - unavailable
            - response too large
            - internal
    Decision:
      type: object
      additionalProperties: false
      required: [id, version, body]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        body:
          type: object
          description: The decision record as stored.
    ResolveRequest:
      type: object
      additionalProperties: false
      required: [repo, env, paths]
      properties:
        repo:
          type: string
          minLength: 1
          description: A lowercase owner/name.
        env:
          type: string
          minLength: 1
        paths:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            minLength: 1
            maxLength: 4096
        valid:
          type: string
          format: date-time
          description: The valid time. Absent means now.
        known:
          type: string
          format: date-time
          description: The transaction time. Absent means now.
    ResolveAnswer:
      type: object
      additionalProperties: false
      required: [valid, known, decisions, resolutions]
      properties:
        valid:
          type: string
          format: date-time
        known:
          type: string
          format: date-time
        decisions:
          type: array
          description: Each decision in force for any requested path, once.
          items:
            $ref: '#/components/schemas/Decision'
        resolutions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, decision_ids]
            properties:
              path:
                type: string
              decision_ids:
                type: array
                description: Ids of decisions in the top-level decisions list, in decision id order.
                items:
                  type: string
                  format: uuid
    DecisionPage:
      type: object
      additionalProperties: false
      required: [valid, known, decisions]
      properties:
        valid:
          type: string
          format: date-time
        known:
          type: string
          format: date-time
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
    Scope:
      type: object
      additionalProperties: false
      required: [id, parent_id, kind, selector]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: [string, 'null']
          format: uuid
          description: Null for an org.
        kind:
          type: string
          enum: [org, domain, service, repo, path, env]
        selector:
          type: string
    ScopePage:
      type: object
      additionalProperties: false
      required: [known, scopes]
      properties:
        known:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
    Waiver:
      type: object
      additionalProperties: false
      required: [id, decision_id, scope_id, ticket_ref, valid_from, expires_at]
      properties:
        id:
          type: string
          format: uuid
        decision_id:
          type: string
          format: uuid
        scope_id:
          type: string
          format: uuid
        ticket_ref:
          type: string
        valid_from:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    WaiverPage:
      type: object
      additionalProperties: false
      required: [valid, known, waivers]
      properties:
        valid:
          type: string
          format: date-time
        known:
          type: string
          format: date-time
        waivers:
          type: array
          items:
            $ref: '#/components/schemas/Waiver'
    CreateScopeRequest:
      type: object
      additionalProperties: false
      required: [kind, selector]
      properties:
        parent_id:
          type: [string, 'null']
          format: uuid
          description: Absent or null for an org, and the parent for every other kind.
        kind:
          type: string
          enum: [org, domain, service, repo, path, env]
        selector:
          type: string
          minLength: 1
          maxLength: 255
          description: Written in the grammar of its kind (ADR-0051).
    ReparentScopeRequest:
      type: object
      additionalProperties: false
      required: [parent_id]
      properties:
        parent_id:
          type: string
          format: uuid
    SupersessionRequest:
      type: object
      additionalProperties: false
      required: [from_decision, to_decision, effective_at]
      properties:
        from_decision:
          type: string
          format: uuid
        to_decision:
          type: string
          format: uuid
        effective_at:
          type: string
          format: date-time
    Supersession:
      type: object
      additionalProperties: false
      required: [id, from_decision, to_decision, effective_at]
      properties:
        id:
          type: string
          format: uuid
        from_decision:
          type: string
          format: uuid
        to_decision:
          type: string
          format: uuid
        effective_at:
          type: string
          format: date-time
    GrandfatherRequest:
      type: object
      additionalProperties: false
      required: [valid_from]
      properties:
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: [string, 'null']
          format: date-time
          description: Absent or null for a period with no deadline, which is a baseline.
    GrandfatherPeriod:
      type: object
      additionalProperties: false
      required: [decision_id, valid_from, valid_until]
      properties:
        decision_id:
          type: string
          format: uuid
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: [string, 'null']
          format: date-time
    BaselineRequest:
      type: object
      additionalProperties: false
      required: [repo, fingerprints]
      properties:
        repo:
          type: string
          maxLength: 255
          description: A lowercase owner/name.
        fingerprints:
          type: array
          minItems: 1
          maxItems: 100000
          description: The registry holds up to 100,000, and the 1 MiB request body takes about 15,600 of them.
          items:
            $ref: '#/components/schemas/Sha256'
    Baseline:
      type: object
      additionalProperties: false
      required: [id, decision_id, repo, fingerprint_count]
      properties:
        id:
          type: string
          format: uuid
        decision_id:
          type: string
          format: uuid
        repo:
          type: string
        fingerprint_count:
          type: integer
          minimum: 1
    WaiverRequest:
      type: object
      additionalProperties: false
      required: [decision_id, scope_id, reason, ticket_ref, valid_from, expires_at]
      properties:
        decision_id:
          type: string
          format: uuid
        scope_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        ticket_ref:
          type: string
          minLength: 1
          maxLength: 200
        valid_from:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: At most 90 days after valid_from (ADR-0054).
    ClearanceRequest:
      type: object
      additionalProperties: false
      description: A clearance has no field. Send an empty object.
    Clearance:
      type: object
      additionalProperties: false
      required: [id, decision_id, premise_id]
      properties:
        id:
          type: string
          format: uuid
        decision_id:
          type: string
          format: uuid
        premise_id:
          type: string
    PremiseHostRequest:
      type: object
      additionalProperties: false
      required: [host, allowed]
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
        allowed:
          type: boolean
    PremiseHost:
      type: object
      additionalProperties: false
      required: [id, host, allowed]
      properties:
        id:
          type: string
          format: uuid
        host:
          type: string
        allowed:
          type: boolean
    PremiseReason:
      type: object
      additionalProperties: false
      required: [id, decision_id, premise_id, opened_at, url, pointer, expected, observed]
      properties:
        id:
          type: string
          format: uuid
        decision_id:
          type: string
          format: uuid
        premise_id:
          type: string
        opened_at:
          type: string
          format: date-time
          description: When the reason was opened.
        url:
          type: string
          description: The URL the probe fetched.
        pointer:
          type: string
          description: The JSON Pointer read from the response.
        expected:
          type: [string, number, boolean, object, array, 'null']
          description: What the premise expects, as stored. At most 1024 bytes.
        observed:
          type: [string, number, boolean, object, array, 'null']
          description: What the probe read, as stored, at most 1024 bytes. It comes from a public URL and is untrusted.
    PremiseReasonPage:
      type: object
      additionalProperties: false
      required: [premise_reasons]
      properties:
        premise_reasons:
          type: array
          items:
            $ref: '#/components/schemas/PremiseReason'
    PremiseHostPage:
      type: object
      additionalProperties: false
      required: [premise_hosts]
      properties:
        premise_hosts:
          type: array
          items:
            $ref: '#/components/schemas/PremiseHost'
    ExportRequest:
      type: object
      additionalProperties: false
      required: [recipient]
      properties:
        recipient:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^age1[0-9a-z]+$'
          description: One native (age1...) or hybrid (age1pq1...) age public key. A private key, a list, a comment and a plugin recipient are 400, and the answer never quotes what was sent.
    Export:
      type: object
      additionalProperties: false
      required: [id, state, requested_by, created_at, finished_at, expires_at, bytes, sha256]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, running, ready, failed]
          description: Pending until the worker takes it, running while it is made, ready when it can be downloaded, and failed when the worker could not make it. Ask again after a failure.
        requested_by:
          type: string
          format: uuid
          description: The person who asked.
        created_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
          description: Null until the export is ready or failed.
        expires_at:
          type: string
          format: date-time
          description: After this the export is 404 and is deleted. It is 24 hours after the request while the export is made, and 24 hours after it finished.
        bytes:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: The size of the archive, set when the export is ready.
        sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: The SHA-256 of the archive in lowercase hexadecimal, set when the export is ready.
    DecisionDraft:
      type: object
      additionalProperties: false
      required: [body, scope_refs, valid_from]
      description: The first version of the decision an approval writes.
      properties:
        body:
          type: object
          description: A JSON object with a slug of lowercase words joined by hyphens, a title, and at most 20 premises that the premise sweep can probe (ADR-0053, ADR-0098). Its stored text form is at most 1 MiB.
        scope_refs:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
        valid_from:
          type: string
          format: date-time
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [approved, rejected]
        decision:
          $ref: '#/components/schemas/DecisionDraft'
          description: Required with an approval and refused with a rejection.
    Approval:
      type: object
      additionalProperties: false
      required: [id, proposal_id, outcome, decision_id]
      properties:
        id:
          type: string
          format: uuid
        proposal_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [approved, rejected]
        decision_id:
          type: [string, 'null']
          format: uuid
          description: The decision the approval wrote, and null for a rejection.
    CheckApprovalRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [approved, rejected]
    CheckApproval:
      type: object
      additionalProperties: false
      required: [id, proposal_id, outcome]
      properties:
        id:
          type: string
          format: uuid
        proposal_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [approved, rejected]
    Proposal:
      type: object
      additionalProperties: false
      required: [id, kind, origin, status, trust_level, payload, confidence, model_id, prompt_version, repo, pr_number, source_url, captured_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [decision]
        origin:
          type: string
          enum: [llm]
        status:
          type: string
          enum: [pending]
        trust_level:
          type: string
          enum: [untrusted]
        payload:
          type: object
        confidence:
          type: number
          minimum: 0
          maximum: 1
        model_id:
          type: string
        prompt_version:
          type: string
        repo:
          type: string
        pr_number:
          type: integer
          minimum: 1
        source_url:
          type: string
          format: uri
        captured_at:
          type: string
          format: date-time
    AgentProposal:
      type: object
      additionalProperties: false
      required: [id, principal_id, status, payload, captured_at]
      properties:
        id:
          type: string
          format: uuid
        principal_id:
          type: string
          format: uuid
          description: The agent that proposed it. Its human sponsor is in the identity store.
        status:
          type: string
          enum: [pending]
        payload:
          type: object
        captured_at:
          type: string
          format: date-time
    CheckProposal:
      type: object
      additionalProperties: false
      required: [id, status, decision_id, decision_version, engine, target, spec, rego, fixtures, repaired, model_id, prompt_version, captured_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        decision_id:
          type: string
          format: uuid
        decision_version:
          type: integer
          minimum: 1
        engine:
          type: string
          enum: [opa]
        target:
          type: string
          enum: [agent-edit]
        spec:
          type: object
        rego:
          type: string
        fixtures:
          type: array
        repaired:
          type: boolean
        model_id:
          type: string
        prompt_version:
          type: string
        captured_at:
          type: string
          format: date-time
    AcceptedCheck:
      type: object
      additionalProperties: false
      required: [id, decision_id, edr_id, decision_version, version_in_force, rego, rego_sha256]
      properties:
        id:
          type: string
          format: uuid
          description: The id of the drafted check. ipso deliver names the Rego file after it.
        decision_id:
          type: string
          format: uuid
        edr_id:
          type: [string, 'null']
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          description: The id of the EDR file of the decision, when its body holds one that is a ULID.
        decision_version:
          type: integer
          minimum: 1
          description: The version of the decision the check was drafted and approved for.
        version_in_force:
          type: integer
          minimum: 1
          description: The version of the decision in force now.
        rego:
          type: [string, 'null']
          description: The stored Rego, byte for byte. Null when decision_version is not version_in_force.
        rego_sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: The sha256 of the rego in lowercase hex. Null when the rego is.
    AuditDecisions:
      type: object
      additionalProperties: false
      required: [decisions]
      properties:
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
    AuditMerge:
      type: object
      additionalProperties: false
      required: [decisions, verdicts]
      properties:
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        verdicts:
          oneOf:
            - type: array
              maxItems: 1000
              items:
                $ref: '#/components/schemas/StoredVerdict'
            - type: 'null'
          description: >-
            The stored verdicts of the commit, newest first, or null when no upload of the repository and the commit
            was stored by the transaction time. Null is unknown, never clean. An empty list means uploads exist and
            hold no verdict. A commit with more than 1000 verdicts is refused whole with 500.
    AuditBeliefs:
      type: object
      additionalProperties: false
      required: [added, removed, changed]
      properties:
        added:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        changed:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, then, now]
            properties:
              id:
                type: string
                format: uuid
              then:
                $ref: '#/components/schemas/Decision'
              now:
                $ref: '#/components/schemas/Decision'
    AuditChain:
      type: object
      additionalProperties: false
      required: [links, versions]
      properties:
        links:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, from, to, effective_at]
            properties:
              id:
                type: string
                format: uuid
              from:
                type: string
                format: uuid
              to:
                type: string
                format: uuid
              effective_at:
                type: string
                format: date-time
        versions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [decision_id, version, valid_from, valid_to]
            properties:
              decision_id:
                type: string
                format: uuid
              version:
                type: integer
                minimum: 1
              valid_from:
                type: string
                format: date-time
              valid_to:
                type: [string, 'null']
                format: date-time
    AuditWaivers:
      type: object
      additionalProperties: false
      required: [waivers]
      properties:
        waivers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, decision_id, scope_id, ticket_ref, expires_at]
            properties:
              id:
                type: string
                format: uuid
              decision_id:
                type: string
                format: uuid
              scope_id:
                type: string
                format: uuid
              ticket_ref:
                type: string
              expires_at:
                type: string
                format: date-time
