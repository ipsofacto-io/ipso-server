openapi: 3.1.0
info:
  title: ipso control plane API
  version: 0.1.0
  summary: Read the decision registry, the review queues, the audit answers and the CI verdicts of one tenant, and record what a person decides.
  description: >-
    The routes that write (ADR-0109) are actions only a person takes: each asks the role policy, which must cover
    every scope the request names, and an agent gets 403. A waiver and an approval take the approver from the
    session or the token and never from the body, and each write is logged with the principal in the same
    transaction. A repeat, and a change the registry refuses because of what it already holds, is 409. The three export routes (ADR-0111) let an admin ask for the export of the tenant and download it. The one
    route no person calls is POST /v1/verdicts, which a CI job calls with its own GitHub
    Actions token and which stores the verdicts of one run (ADR-0102). Every other route asks the role policy
    before it runs, and a principal no role of which allows the route gets 403 (ADR-0108). The five audit
    routes need the auditor or the admin role. The tenant is always the one the bearer token or the session cookie speaks for, or,
    for that upload, the one that owns the installation of the repository the signed token names. So no
    route takes a tenant, and a query key `tenant` or `tenant_id` is 400. A request that carries an Authorization header is read as a bearer call, whatever
    cookie it also carries.
    A repeated query key, and a query key the operation does not list, are 400. Times are RFC 3339. Lists
    page by id from the highest: pass the last `id` of a page as `before` to read the next one. An answer
    over the response cap is refused whole with 500 `response too large` and never sent cut short. See
    ADR-0090 in ipso-spec.
  license:
    name: FSL-1.1-ALv2
    url: https://github.com/ipsofacto-io/ipso-server/blob/main/LICENSE
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: registry
    description: Decisions, scopes, and waivers, as they were in force and as they were known.
  - name: review
    description: Proposals that wait for a person.
  - name: audit
    description: The five audit questions of section 2.3 (ADR-0055).
  - name: verification
    description: The verdicts a CI job uploads, and the per-repository and per-decision results (ADR-0102).
  - name: export
    description: The export of the whole tenant that an admin asks for and downloads (ADR-0111).
paths:
  /v1/resolve:
    post:
      operationId: resolve
      tags: [registry]
      summary: Resolve the decisions in force for each changed path of a check.
      description: >-
        A check request names the repo, the env, and every changed path, and gets one resolution for each
        path (ADR-0051). Each decision is returned once, and a path names it by id, so an org-wide decision
        is not repeated for every path (ADR-0092). An omitted field would match every scope and widen the
        answer, so all three are required. Every path is read in one transaction. This route reads only.
        It is POST because a list of paths does not fit a URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: Each decision once, and one resolution for each path, in the order sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveAnswer'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/decisions:
    get:
      operationId: list_decisions
      tags: [registry]
      summary: List the decisions in force, each at its highest version.
      parameters:
        - $ref: '#/components/parameters/Valid'
        - $ref: '#/components/parameters/Known'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: One page of decisions, by id from the highest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionPage'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/decisions/{ref}:
    get:
      operationId: get_decision
      tags: [registry]
      summary: Read the decisions an id or a slug names.
      description: A slug can name more than one decision. An id or slug that names nothing in this tenant is an empty list.
      parameters:
        - name: ref
          in: path
          required: true
          description: A decision id or slug.
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Valid'
        - $ref: '#/components/parameters/Known'
      responses:
        '200':
          description: The decisions the ref names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionPage'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/scopes:
    get:
      operationId: list_scopes
      tags: [registry]
      summary: List the scope tree as it was known.
      parameters:
        - $ref: '#/components/parameters/Known'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: One page of scopes, by id from the highest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopePage'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: create_scope
      tags: [registry]
      summary: Create a scope.
      description: >-
        Only a person takes it, so an agent receives 403, and the role policy must cover every scope the request names (ADR-0108, ADR-0109). A scope is insert-only: a typo is corrected by retiring the node and creating another.
        An org has no parent and every other kind has one, and the parent must be of a kind the node can sit under (ADR-0051).
        Creating an org needs the role over the whole tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScopeRequest'
      responses:
        '201':
          description: The scope that was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scope'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/scopes/{id}/parent:
    put:
      operationId: reparent_scope
      tags: [registry]
      summary: Move a scope under another parent.
      description: >-
        Only a person takes it, so an agent receives 403, and the role policy must cover every scope the request names (ADR-0108, ADR-0109). The node keeps its id, so every decision, waiver and role binding that names it follows (ADR-0056).
        The role must cover the node and the new parent. A move under the node itself or one of its descendants, a parent of a kind the node cannot sit under, and a repo whose owner is not the org above the new parent are 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReparentScopeRequest'
      responses:
        '200':
          description: The scope under its new parent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scope'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/scopes/{id}:
    delete:
      operationId: retire_scope
      tags: [registry]
      summary: Retire a scope.
      description: >-
        Only a person takes it, so an agent receives 403, and the role policy must cover every scope the request names (ADR-0108, ADR-0109). A scope that still has a child, or that a role binding still names, is 409: retire the children and remove the bindings first (ADR-0056, ADR-0108). A waiver or a decision that names the scope is kept.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The scope was retired.
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/supersessions:
    post:
      operationId: record_supersession
      tags: [registry]
      summary: Record that a decision replaces another from an instant.
      description: >-
        Only a person takes it, so an agent receives 403, and the role policy must cover every scope the request names (ADR-0108, ADR-0109). The role must cover every scope of both decisions. The insert closes the old decision in the same transaction (ADR-0052).
        An instant that the two decisions do not both span, a decision that is already superseded, and a decision that already has a successor are 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupersessionRequest'
      responses:
        '201':
          description: The supersession that was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supersession'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/decisions/{decisionID}/grandfather-period:
    post:
      operationId: record_grandfather_period
      tags: [registry]
      summary: Record the grandfather period of a decision.
      description: >-
        Only a person takes it, so an agent receives 403, and the role policy must cover every scope the request names (ADR-0108, ADR-0109). The role must cover every scope of the decision. A decision has one period, ever, so a second is 409 (ADR-0052). A period with no end is a baseline.
      parameters:
        - name: decisionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrandfatherRequest'
      responses:
        '201':
          description: The period that was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrandfatherPeriod'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/decisions/{decisionID}/baselines:
    post:
      operationId: record_baseline
      tags: [registry]
      summary: Record the baseline of a decision in one repository.
      description: >-
        Only a person takes it, so an agent receives 403, and the role policy must cover every scope the request names (ADR-0108, ADR-0109). The role must cover every scope of the decision. A baseline holds the fingerprints of the violations that already exist, as digests and never paths or messages (ADR-0052, ADR-0059).
        The decision needs its grandfather period first, and there is one baseline for each decision and repository, so a missing period and a second baseline are 409.
        The web app sends the digests of the file that `ipso baseline export` writes, which holds no salt (ADR-0121). The body is at most 1 MiB, which is about 15,600 fingerprints, and a larger one is 413 with nothing stored.
      parameters:
        - name: decisionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineRequest'
      responses:
        '201':
          description: The baseline that was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Baseline'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/decisions/{decisionID}/premises/{premiseID}/clearance:
    post:
      operationId: clear_premise_reason
      tags: [registry]
      summary: Clear the open review reason of a premise.
      description: >-
        Only a person takes it, so an agent receives 403, and the role policy must cover every scope the request names (ADR-0108, ADR-0109). The role must cover every scope of the decision. The clearance says an owner looked, and it does not change the decision (ADR-0053).
        A premise with no open reason is 404. The worker writes the evaluation and the reason, and no route does. The body is an empty object.
      parameters:
        - name: decisionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: premiseID
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearanceRequest'
      responses:
        '201':
          description: The clearance that was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clearance'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/waivers:
    get:
      operationId: list_waivers
      tags: [registry]
      summary: List the waivers whose period covers the valid time.
      description: A waiver's reason and approver are not returned (ADR-0054, ADR-0055).
      parameters:
        - $ref: '#/components/parameters/Valid'
        - $ref: '#/components/parameters/Known'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: One page of waivers, by id from the highest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiverPage'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: record_waiver
      tags: [registry]
      summary: Record a waiver with an expiry.
      description: >-
        Only a person takes it, so an agent receives 403, and the role policy must cover every scope the request names (ADR-0108, ADR-0109). The approver is the authenticated person and is never in the body (ADR-0076, ADR-0054). The period is half open and at most 90 days, and it must sit inside a current row of the decision.
        A waiver whose scope is not on or under the scopes of the decision, or whose period the decision does not contain, is 409. The answer leaves out the reason and the approver, as the read does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaiverRequest'
      responses:
        '201':
          description: The waiver that was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Waiver'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/premise-reasons:
    get:
      operationId: list_premise_reasons
      tags: [registry]
      summary: List the open review reasons of the premises.
      description: >-
        A reason is open while no clearance names it, whatever the valid period of its decision, so every reason that POST /v1/decisions/{decisionID}/premises/{premiseID}/clearance can close is here (ADR-0053, ADR-0117). Each carries the fail that opened it as the evaluation stored it: the URL, the pointer, the expected value and the observed value. The body of the response is never stored and is never returned, and neither is its digest. The observed value was taken from a public URL, so it is untrusted: show it as text. The answer is the present and takes no time. Any role that may read the registry reads it.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: One page of open reasons, by id from the highest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiseReasonPage'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/premise-hosts:
    get:
      operationId: list_premise_hosts
      tags: [registry]
      summary: List the hosts of the premise allowlist.
      description: >-
        The latest row of each host, the one the probe reads: the greatest start of its period and then the greatest id. A host whose latest row says allowed false was withdrawn and is listed so that it can be allowed again. A tenant with no row allows no host (ADR-0053, ADR-0098, ADR-0117). Pages are by the id of that latest row, so a host that is allowed or withdrawn again moves to the top. Any role that may read the registry reads it.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: One page of the allowlist, by id from the highest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiseHostPage'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: allow_premise_host
      tags: [registry]
      summary: Allow or withdraw a host a premise probe may dial.
      description: >-
        Only an admin who is a person takes it (ADR-0108). The latest row for a host decides, and a tenant with no row allows no host (ADR-0053, ADR-0098). A host is a DNS name in lowercase ASCII, in punycode when it is not, and never an address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PremiseHostRequest'
      responses:
        '201':
          description: The row that was appended to the allowlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiseHost'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/proposals:
    get:
      operationId: list_proposals
      tags: [review]
      summary: List the decisions proposed from merged pull requests (ADR-0062).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: One page of pending proposals, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Timeout'
  /v1/proposals/{id}/approval:
    post:
      operationId: approve_proposal
      tags: [review]
      summary: Approve or reject a pull request proposal.
      description: >-
