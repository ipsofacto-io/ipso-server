# The front of the stack. It limits each client before a request reaches the API, so a request that
# carries no valid token costs the API nothing but a refusal (ADR-0090: the guard has no tenant to
# charge until the token checks pass). The key is the client address as this container sees it. A
# deployment behind another proxy sets the real address first.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;
    # The root file system is read-only, so every temp path is under /tmp, which is a tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1m;

    limit_req_zone $binary_remote_addr zone=per_client:10m rate=20r/s;
    limit_req_status 429;

    # The API is found by its service name when nginx starts. The front restarts on failure, so it
    # waits for the API container to exist.
    upstream ipso_api {
        server api:8080;
    }

    server {
        listen 8080;

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"rate_limited"}';
        }

        location / {
            limit_req zone=per_client burst=40 nodelay;
            proxy_pass http://ipso_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            # The archive of an export is far over what fits in memory buffers. With no temp file nginx reads
            # from the API only as fast as the client takes the answer, and never spools it into the tmpfs at
            # /tmp (ADR-0111).
            proxy_max_temp_file_size 0;
        }
    }
}
