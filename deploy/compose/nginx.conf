# The front of the stack. It limits each client before a request reaches the API, so a request that
# carries no valid token costs the API nothing but a refusal (ADR-0090: the guard has no tenant to
# charge until the token checks pass). The key is the client address as this container sees it. A
# deployment behind another proxy sets the real address first.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    client_max_body_size 1m;

    limit_req_zone $binary_remote_addr zone=per_client:10m rate=20r/s;
    limit_req_status 429;

    # Docker's resolver, so the API can restart without nginx caching an old address.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 8080;

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":"rate_limited"}';
        }

        location / {
            limit_req zone=per_client burst=40 nodelay;
            set $api http://api:8080;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }
    }
}
