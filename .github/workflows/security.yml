name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ipsofacto-io/.github/.github/workflows/security.yml@263b6c567edc84afbd790890a458c386df279beb
