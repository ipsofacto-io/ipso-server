name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ipsofacto-io/.github/.github/workflows/security.yml@97dee3da02874afba6524584a441411dae702871
