name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ci / test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  integration:
    name: ci / integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Testcontainers starts PostgreSQL 18 on the runner's Docker.
      - run: go test -tags integration -count=1 ./...

  mcp-conformance:
    name: ci / mcp-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/mcpremote/testdata/tool/package-lock.json
      - name: Install the conformance suite
        working-directory: internal/mcpremote/testdata/tool
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          echo "${GITHUB_WORKSPACE}/internal/mcpremote/testdata/tool/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run the scenarios that apply to the remote handler
        run: go test -tags conformance ./internal/mcpremote -run TestConformance -count=1 -v

  # The ipso-web pact (ADR-0091): regenerated from its consumer test, verified against the handler
  # on PostgreSQL 18, and refused when the committed file differs. pact-go links the Pact FFI, a
  # native library that is downloaded at a pinned version and checked against a pinned digest.
  pact:
    name: ci / pact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACT_FFI_VERSION: "0.5.8"
      # SHA-256 of libpact_ffi-linux-x86_64.so.gz in the libpact_ffi-v0.5.8 release.
      PACT_FFI_SHA256: 2e4e234bac79be7d934df7111f72d98c289c66e56ceda6ef568145ff73af20f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the Pact FFI
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/pact-ffi"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$dir/libpact_ffi.so.gz" \
            "https://github.com/pact-foundation/pact-reference/releases/download/libpact_ffi-v${PACT_FFI_VERSION}/libpact_ffi-linux-x86_64.so.gz"
          echo "${PACT_FFI_SHA256}  $dir/libpact_ffi.so.gz" | sha256sum --check --strict
          gunzip "$dir/libpact_ffi.so.gz"
          echo "CGO_LDFLAGS=-L$dir -Wl,-rpath,$dir" >> "$GITHUB_ENV"
      - name: Regenerate the pact
        run: go test -tags pact -run TestPactConsumer -count=1 ./internal/api
      # Testcontainers starts PostgreSQL 18 on the runner's Docker.
      - name: Verify the pact against the handler
        run: go test -tags 'integration pact' -run TestPactProvider -count=1 ./internal/api
      # Runs after a failed verification too, so one run shows both answers.
      - name: Refuse a committed pact that differs
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- api/pacts)" ]; then
            git diff -- api/pacts
            echo "::group::The pact the consumer test wrote"
            cat api/pacts/ipso-web-ipso-server.json
            echo "::endgroup::"
            echo "::error::api/pacts differs from what the consumer test writes. Commit the regenerated file."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pact-ipso-web-ipso-server
          path: api/pacts/ipso-web-ipso-server.json
          if-no-files-found: error

  # The local stack (ADR-0095): started from a clean checkout with the test-only values of
  # .env.example, then asked questions the way a person would. The images are pinned by digest.
  compose:
    name: ci / compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose --env-file .env.example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start the stack
        run: ${COMPOSE} up --build --detach
      - name: Smoke test the API
        run: |
          set -euo pipefail
          ${COMPOSE} cp certs:/certs/ca.pem "${RUNNER_TEMP}/ca.pem"
          set -a
          . ./.env.example
          set +a
          IPSO_SMOKE_CA="${RUNNER_TEMP}/ca.pem" go test -tags compose -count=1 -v ./deploy/compose
      # The api role must refuse the migration role, which owns the tables.
      - name: Refuse to serve as the migration role
        run: |
          # The runner's shell has -e, and the exit status of the api is what this step looks at.
          set +e
          set -uo pipefail
          set -a
          . ./.env.example
          set +a
          out="$(${COMPOSE} run --rm --no-deps             -e "IPSO_DATABASE_URL=postgres://ipso_migrate:${IPSO_MIGRATE_PASSWORD}@postgres:5432/ipso?sslmode=disable"             api 2>&1)"
          code=$?
          echo "${out}"
          if [ "${code}" -eq 0 ]; then
            echo "::error::the api started as the migration role"
            exit 1
          fi
          echo "${out}" | grep -q "refusing to start"
      - name: Show the logs of the stack
        if: failure()
        run: ${COMPOSE} logs --no-color
      - name: Stop the stack
        if: always()
        run: ${COMPOSE} down --volumes

  lint:
    name: ci / lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          args: --build-tags=integration,compose

  licenses:
    name: ci / licenses
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      # This repository is FSL-1.1-ALv2, which go-licenses cannot classify, so its own packages
      # are ignored. Every dependency is still checked against the allowlist. The binary serves
      # ./internal/api since IPSO-133, so the one package covers it.
      - run: go-licenses check ./cmd/ipso-server --ignore github.com/ipsofacto-io/ipso-server --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC
