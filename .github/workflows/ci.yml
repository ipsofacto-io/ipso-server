name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ci / test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  # The web app (ADR-0106): the types match the API document, the units pass, and the build is what the binary
  # embeds. Last, the Go handler reads that real build, so a file type or a path it refuses fails here.
  web:
    name: ci / web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: The API types match api/openapi.yaml
        working-directory: web
        run: npm run api:check
      - name: Build
        working-directory: web
        run: npm run build
      - name: The handler serves the build
        run: go test -count=1 ./internal/webapp

  integration:
    name: ci / integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Testcontainers starts PostgreSQL 18 on the runner's Docker.
      - run: go test -tags integration -count=1 ./...

  mcp-conformance:
    name: ci / mcp-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/mcpremote/testdata/tool/package-lock.json
      - name: Install the conformance suite
        working-directory: internal/mcpremote/testdata/tool
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          echo "${GITHUB_WORKSPACE}/internal/mcpremote/testdata/tool/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run the scenarios that apply to the remote handler
        run: go test -tags conformance ./internal/mcpremote -run TestConformance -count=1 -v

  # The ipso-web pact (ADR-0091): regenerated by the pact-js tests of the web app, verified against the
  # handler on PostgreSQL 18, and refused when the committed file differs. pact-go links the Pact FFI, a
  # native library that is downloaded at a pinned version and checked against a pinned digest.
  pact:
    name: ci / pact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACT_FFI_VERSION: "0.5.8"
      # SHA-256 of libpact_ffi-linux-x86_64.so.gz in the libpact_ffi-v0.5.8 release.
      PACT_FFI_SHA256: 2e4e234bac79be7d934df7111f72d98c289c66e56ceda6ef568145ff73af20f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the Pact FFI
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/pact-ffi"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$dir/libpact_ffi.so.gz" \
            "https://github.com/pact-foundation/pact-reference/releases/download/libpact_ffi-v${PACT_FFI_VERSION}/libpact_ffi-linux-x86_64.so.gz"
          echo "${PACT_FFI_SHA256}  $dir/libpact_ffi.so.gz" | sha256sum --check --strict
          gunzip "$dir/libpact_ffi.so.gz"
          echo "CGO_LDFLAGS=-L$dir -Wl,-rpath,$dir" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web app's dependencies
        working-directory: web
        run: npm ci
      - name: Regenerate the pact
        working-directory: web
        run: npm run test:pact
      # Testcontainers starts PostgreSQL 18 on the runner's Docker.
      - name: Verify the pact against the handler
        run: go test -tags 'integration pact' -run TestPactProvider -count=1 ./internal/api
      # Runs after a failed verification too, so one run shows both answers.
      - name: Refuse a committed pact that differs
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- api/pacts)" ]; then
            git diff -- api/pacts
            echo "::group::The pact the web app's tests wrote"
            cat api/pacts/ipso-web-ipso-server.json
            echo "::endgroup::"
            echo "::error::api/pacts differs from what the web app's pact tests write. Run npm run test:pact in web/ and commit the regenerated file."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pact-ipso-web-ipso-server
          path: api/pacts/ipso-web-ipso-server.json
          if-no-files-found: error

  # The local stack (ADR-0095): started from a clean checkout with the test-only values of
  # .env.example, then asked questions the way a person would. The images are pinned by digest.
  compose:
    name: ci / compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose --env-file .env.example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start the stack
        run: ${COMPOSE} up --build --detach
      - name: Smoke test the API
        run: |
          set -euo pipefail
          ${COMPOSE} cp certs:/certs/ca.pem "${RUNNER_TEMP}/ca.pem"
          set -a
          . ./.env.example
          set +a
          IPSO_SMOKE_CA="${RUNNER_TEMP}/ca.pem" go test -tags compose -count=1 -v ./deploy/compose
      # The api role must refuse the migration role, which owns the tables.
      - name: Refuse to serve as the migration role
        run: |
          # The runner's shell has -e, and the exit status of the api is what this step looks at.
          set +e
          set -uo pipefail
          set -a
          . ./.env.example
          set +a
          out="$(${COMPOSE} run --rm --no-deps             -e "IPSO_DATABASE_URL=postgres://ipso_migrate:${IPSO_MIGRATE_PASSWORD}@postgres:5432/ipso?sslmode=disable"             api 2>&1)"
          code=$?
          echo "${out}"
          if [ "${code}" -eq 0 ]; then
            echo "::error::the api started as the migration role"
            exit 1
          fi
          echo "${out}" | grep -q "refusing to start"
      # The worker serves no request, so its sweeps are the proof that it runs: it connected as the
      # application role, passed its start gates, and used River's tables. A job of each sweep kind
      # completes when the worker starts, whether or not a notice, a premise, an export or a chat
      # digest is due.
      - name: The worker completes its first sweeps
        run: |
          set -euo pipefail
          set -a
          . ./.env.example
          set +a
          for attempt in $(seq 1 45); do
            completed="$(${COMPOSE} exec -T -e PGPASSWORD="${IPSO_APP_PASSWORD}" postgres \
              psql --host=127.0.0.1 --username=ipso_app --dbname=ipso --tuples-only --no-align \
              --command="SELECT count(DISTINCT kind) FROM river.river_job WHERE kind IN ('waiver_notices', 'premise_sweep', 'tenant_export_sweep', 'chat_digests') AND state = 'completed'")"
            if [ "${completed}" -ge 4 ]; then
              ${COMPOSE} ps --status running --services > "${RUNNER_TEMP}/running.txt"
              grep -qx worker "${RUNNER_TEMP}/running.txt"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the worker did not complete a waiver notice sweep, a premise sweep, an export sweep and a chat digest within 90 seconds"
          exit 1
      # The worker must refuse the migration role, which owns the tables, like the api.
      - name: Refuse to run the worker as the migration role
        run: |
          # The runner's shell has -e, and the exit status of the worker is what this step looks at.
          set +e
          set -uo pipefail
          set -a
          . ./.env.example
          set +a
          out="$(${COMPOSE} run --rm --no-deps \
            -e "IPSO_DATABASE_URL=postgres://ipso_migrate:${IPSO_MIGRATE_PASSWORD}@postgres:5432/ipso?sslmode=disable" \
            worker 2>&1)"
          code=$?
          echo "${out}"
          if [ "${code}" -eq 0 ]; then
            echo "::error::the worker started as the migration role"
            exit 1
          fi
          echo "${out}" | grep -q "refusing to start"
      - name: Show the logs of the stack
        if: failure()
        run: ${COMPOSE} logs --no-color
      - name: Stop the stack
        if: always()
        run: ${COMPOSE} down --volumes

  chart:
    name: ci / chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm, kind, and kubectl
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "$bin"
          install_archive() {
            local url="$1" sum="$2" inside="$3" tmp
            tmp="$(mktemp -d)"
            curl -fsSL -o "${tmp}/archive.tar.gz" "$url"
            echo "${sum}  ${tmp}/archive.tar.gz" | sha256sum -c -
            tar -xzf "${tmp}/archive.tar.gz" -C "$tmp"
            install -m 0755 "${tmp}/${inside}" "${bin}/$(basename "$inside")"
          }
          install_file() {
            local url="$1" sum="$2" name="$3" tmp
            tmp="$(mktemp -d)"
            curl -fsSL -o "${tmp}/${name}" "$url"
            echo "${sum}  ${tmp}/${name}" | sha256sum -c -
            install -m 0755 "${tmp}/${name}" "${bin}/${name}"
          }
          install_archive https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b linux-amd64/helm
          install_file https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d kind
          install_file https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f kubectl
          echo "$bin" >> "$GITHUB_PATH"
      - name: Lint the chart and install it on kind
        run: bash charts/ipso/ci.sh kind

  lint:
    name: ci / lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          args: --build-tags=integration,compose

  licenses:
    name: ci / licenses
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      # This repository is FSL-1.1-ALv2, which go-licenses cannot classify, so its own packages
      # are ignored. Every dependency is still checked against the allowlist. The binary serves
      # ./internal/api since IPSO-133, so the one package covers it. MPL-2.0 is on the list for River
      # (ADR-0096), and the next step keeps it there for River alone.
      - run: go-licenses check ./cmd/ipso-server --ignore github.com/ipsofacto-io/ipso-server --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0
      - name: Allow MPL-2.0 for River only
        run: |
          set -euo pipefail
          go-licenses report ./cmd/ipso-server --ignore github.com/ipsofacto-io/ipso-server > "${RUNNER_TEMP}/licenses.csv"
          # The filter below reads the license name from the third column and fails only when it finds
          # a module. It would pass for any other shape of report, so first require the row it is meant
          # to see: River under MPL-2.0.
          river="$(awk -F, '$3 == "MPL-2.0" && $1 ~ /^github.com\/riverqueue\// { n++ } END { print n + 0 }' "${RUNNER_TEMP}/licenses.csv")"
          if [ "${river}" -eq 0 ]; then
            echo "::error::the report lists no River package under MPL-2.0, so its format may have changed"
            exit 1
          fi
          other="$(awk -F, '$3 == "MPL-2.0" && $1 !~ /^github.com\/riverqueue\// { print $1 }' "${RUNNER_TEMP}/licenses.csv")"
          if [ -n "${other}" ]; then
            echo "::error::MPL-2.0 is allowed for River only (ADR-0097). Also MPL-2.0: ${other}"
            exit 1
          fi
      # What ships to a browser is every package of the web app that is not a dev dependency (ADR-0106).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Licenses of the web app's shipped packages
        working-directory: web
        run: npm run licenses

  # The air-gapped tar (ADR-0142). The chart job stays read-only. This job may ask Fulcio
  # for a certificate for this workflow. It has no packages permission and does not push to GHCR.
  airgap:
    name: ci / airgap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm, kind, kubectl, cosign, Syft, and crane
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "$bin"
          install_archive() {
            local url="$1" sum="$2" inside="$3" tmp
            tmp="$(mktemp -d)"
            curl -fsSL -o "${tmp}/archive.tar.gz" "$url"
            echo "${sum}  ${tmp}/archive.tar.gz" | sha256sum -c -
            tar -xzf "${tmp}/archive.tar.gz" -C "$tmp"
            install -m 0755 "${tmp}/${inside}" "${bin}/$(basename "$inside")"
          }
          install_file() {
            local url="$1" sum="$2" name="$3" tmp
            tmp="$(mktemp -d)"
            curl -fsSL -o "${tmp}/${name}" "$url"
            echo "${sum}  ${tmp}/${name}" | sha256sum -c -
            install -m 0755 "${tmp}/${name}" "${bin}/${name}"
          }
          install_archive https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b linux-amd64/helm
          install_file https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d kind
          install_file https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f kubectl
          install_file https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa cosign
          install_archive https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d syft
          install_archive https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0 crane
          echo "$bin" >> "$GITHUB_PATH"
      - name: Pack, verify offline, and install with registry egress cut
        # End the step before the 30 minute job limit. A job cancel drops the log.
        run: timeout --kill-after=20s 28m bash deploy/airgap/ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipso-airgap
          path: ${{ runner.temp }}/ipso-airgap/ipso-airgap.tar
          if-no-files-found: error
